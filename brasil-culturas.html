<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1F6B4A">
<title>Brasil de Muitas Culturas</title>
<style>
/* Layout: mapa de missões (home) -> leitura obrigatória do texto -> minijogo em tela cheia -> resultado. */
:root{--ink:#2B2118;--paper:#FFF8EC;--card:#fff;--line:#E7D9C2;--ok:#1F9D57;--bad:#D93B3F;--gold:#F2A900;
  --nac:#2F7DE1;--sim:#E5484D;--mul:#8E44AD;--ind:#1F8A4C;--afr:#D9730D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.screen{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;padding:14px 14px 28px}

/* ---------- Home ---------- */
.hero{border-radius:22px;padding:16px 16px 14px;color:#fff;background:linear-gradient(135deg,#1F8A4C,#12603A 55%,#0E4A6B);position:relative;overflow:hidden;box-shadow:0 6px 0 #0B3B27}
.hero h1{margin:0;font-size:25px;font-weight:900;line-height:1.1}
.hero p{margin:5px 0 0;font-size:14px;font-weight:600;opacity:.95}
.hero .zig{position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(135deg,#F2A900 0 9px,#D93B3F 9px 18px,#fff 18px 27px,#2B2118 27px 36px)}
.hero .tot{margin-top:9px;display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;margin-bottom:8px}
.how{font-size:13.5px;font-weight:700;color:#6B5A45;margin:12px 4px 10px;text-align:center}
.mis{background:var(--card);border:2px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.mis-h{display:flex;gap:11px;align-items:center;padding:11px 12px;color:#fff;background:var(--c)}
.mis-h .ico{flex:none;width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:28px}
.mis-h h2{margin:0;font-size:17.5px;font-weight:900;line-height:1.15}
.mis-h small{display:block;font-size:12.5px;font-weight:700;opacity:.95;margin-top:2px}
.mis-h .st{margin-left:auto;flex:none;background:#fff;color:var(--c);font-size:11.5px;font-weight:900;border-radius:999px;padding:4px 9px;white-space:nowrap}
.tx{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-top:2px solid var(--line);min-height:58px}
.tx:active{background:#FBF1DF}
.tx .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;display:grid;place-items:center}
.tx b{display:block;font-size:15.5px;line-height:1.2}
.tx span.s{font-size:12.5px;font-weight:700;color:#7A6853}
.tx .go{margin-left:auto;flex:none;font-size:13px;font-weight:900;color:var(--c);white-space:nowrap}
.tx .stars{letter-spacing:1px}.off{filter:grayscale(1);opacity:.3}
.foot{display:flex;gap:10px;justify-content:center;margin-top:8px}
.foot button{font-size:13px;font-weight:800;color:#7A6853;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff}

/* ---------- Leitura ---------- */
#read{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto}
.rd{max-width:560px;margin:0 auto;padding:12px 14px 120px}
.rd-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rd-top .tag{background:var(--c);color:#fff;font-weight:900;font-size:12.5px;border-radius:999px;padding:5px 11px}
.rd-top .x{margin-left:auto;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);font-weight:900;font-size:17px}
.rd-step{font-size:13px;font-weight:800;color:#7A6853;margin:0 2px 4px}
.rd h2{margin:0 0 9px;font-size:23px;font-weight:900;line-height:1.15}
.rd-card{background:#fff;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:16px;padding:12px 14px;font-size:18.5px;line-height:1.5}
.rd-card p{margin:0 0 9px}.rd-card p:last-child{margin-bottom:0}
.rd-card b{color:var(--c)}
.rd-card p.hl{background:#FFF1B8;border-radius:8px;box-shadow:0 0 0 5px #FFF1B8}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:14px;font-weight:700}
.pair svg{width:72px;height:48px;border-radius:5px;box-shadow:0 0 0 1.5px #0002;display:block;margin:0 auto 4px}
.pair b{display:block;font-size:16.5px;color:var(--c)}
.rd-act{display:flex;gap:8px;margin-top:10px}
.rd-act button{flex:1;min-height:46px;border-radius:13px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14.5px}
.rd-bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 26%)}
.rd-bar .in{max-width:532px;margin:0 auto}
.rd-msg{text-align:center;font-size:13.5px;font-weight:800;color:#7A6853;margin-bottom:6px}
.cta{position:relative;overflow:hidden;width:100%;min-height:58px;border-radius:17px;background:var(--c,#1F8A4C);color:#fff;font-size:19px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.cta:disabled{background:#B9AD9C;box-shadow:0 5px 0 #948979}
.cta .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
.cta span{position:relative}

/* ---------- Jogo ---------- */
#game{position:fixed;inset:0;z-index:10;background:#123;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:8px 8px 0}
.hud .b{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.94);font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:none}
.hud .pill{background:rgba(255,255,255,.94);border-radius:999px;padding:7px 11px;font-weight:900;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.hud .sp{flex:1}
#qcard{position:absolute;left:8px;right:8px;top:58px;z-index:3;background:#fff;border-radius:16px;padding:9px 13px 10px;box-shadow:0 4px 0 rgba(0,0,0,.25);border:3px solid var(--c,#1F8A4C);max-width:540px;margin:0 auto}
#qp{font-size:12px;font-weight:900;color:var(--c,#1F8A4C);text-transform:uppercase;letter-spacing:.04em}
#qq{font-size:19px;font-weight:900;line-height:1.22;margin-top:1px}
#toast{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;border-radius:16px;padding:12px 14px;font-size:17px;font-weight:800;text-align:center;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);max-width:520px;margin:0 auto;pointer-events:none}
#toast.ok{background:var(--ok)}#toast.bad{background:var(--bad)}#toast.info{background:#2B2118}
#ghint{position:absolute;left:50%;transform:translateX(-50%);top:46%;z-index:5;background:rgba(20,20,20,.82);color:#fff;font-size:14px;font-weight:800;border-radius:999px;padding:8px 14px;white-space:nowrap;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}

/* Genius */
#genius{position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 50% 30%,#2A3566,#131A38 70%);display:flex;flex-direction:column;align-items:center;padding:58px 10px calc(10px + env(safe-area-inset-bottom));gap:1.2vh;overflow:hidden}
.g-card{background:#fff;border-radius:16px;padding:8px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.3);max-width:96vw}
.g-card svg{height:min(13vh,92px);width:auto;aspect-ratio:3/2;border-radius:6px;box-shadow:0 0 0 2px #0002;flex:none}
.g-card .big{font-size:min(9vh,60px);line-height:1}
.g-card .nm{font-size:13px;font-weight:800;color:#7A6853}
.g-card .ct{font-size:min(4.4vh,30px);font-weight:900;line-height:1.05}
.g-q{color:#fff;font-size:min(2.9vh,18.5px);font-weight:800;text-align:center;line-height:1.2;padding:0 6px}
.g-q b{color:#FFD766}
.g-board{position:relative;width:min(90vw,46vh,400px);aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
.gp{position:relative;color:#fff;font-weight:900;font-size:min(4.6vw,2.5vh,19px);line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--k);box-shadow:inset 0 -7px 0 rgba(0,0,0,.25),inset 0 0 0 4px rgba(255,255,255,.14);transition:filter .1s,transform .1s;text-shadow:0 1px 0 rgba(0,0,0,.35);word-break:break-word;hyphens:auto}
.gp:nth-child(1){border-radius:100% 14px 14px 14px;padding:24% 5% 6% 24%}
.gp:nth-child(2){border-radius:14px 100% 14px 14px;padding:24% 24% 6% 5%}
.gp:nth-child(3){border-radius:14px 14px 14px 100%;padding:6% 5% 24% 24%}
.gp:nth-child(4){border-radius:14px 14px 100% 14px;padding:6% 24% 24% 5%}
.gp.lit{filter:brightness(1.7) saturate(1.2);transform:scale(1.03)}
.gp.dim{filter:brightness(.42) saturate(.6)}
.gp.buzz{animation:buzz .35s}
.g-board.mem .gp span{visibility:hidden}
.g-board.lock{pointer-events:none}
.g-knob{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#131A38;border:5px solid #0A0E22;color:#fff;display:grid;place-items:center;font-weight:900;font-size:min(6vw,3.2vh,26px);pointer-events:none;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.g-st{color:#fff;font-weight:800;font-size:min(2.7vh,17px);text-align:center;min-height:1.3em}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- Resultado / confirmar ---------- */
#result{text-align:center}
.res-stars{font-size:54px;margin-top:10px}
#result h1{margin:2px 0;font-size:27px;font-weight:900}
.res-num{font-weight:800;color:#6B5A45}
.res-box{background:#fff;border:2px solid var(--line);border-radius:16px;padding:11px 13px;margin:12px 0;text-align:left;font-size:15.5px;line-height:1.4}
.res-box h3{margin:0 0 5px;font-size:15px;font-weight:900}
.res-box div{padding:5px 0;border-top:1px dashed var(--line)}.res-box div b{color:var(--ok)}
.res-btns{display:flex;flex-direction:column;gap:10px}
.btn2{min-height:52px;border-radius:15px;background:#fff;border:2px solid var(--line);font-weight:900;font-size:16.5px;width:100%}
#confirm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px}
#confirm .box{background:#fff;border-radius:20px;padding:18px;max-width:360px;width:100%;text-align:center}
#confirm h3{margin:0 0 6px;font-size:20px}#confirm p{margin:0 0 14px;font-weight:600;color:#6B5A45}
#confirm .row{display:flex;gap:10px}#confirm .row button{flex:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
</style>
</head>
<body>

<div id="home" class="screen"></div>

<div id="read" hidden><div class="rd">
  <div class="rd-top"><span class="tag" id="rdTag"></span><button class="x" id="rdX" aria-label="Fechar">✕</button></div>
  <div class="rd-step" id="rdStep"></div>
  <h2 id="rdTitle"></h2>
  <div class="rd-card" id="rdText"></div>
  <div id="rdPairs"></div>
  <div class="rd-act"><button id="rdSay">🔊 Ouvir o texto</button></div>
</div>
<div class="rd-bar"><div class="in"><div class="rd-msg" id="rdMsg"></div><button class="cta" id="rdGo"><i class="fill"></i><span id="rdGoT"></span></button></div></div></div>

<div id="game" hidden>
  <canvas id="cv"></canvas>
  <div id="genius" hidden>
    <div class="g-card" id="gCard"></div>
    <div class="g-q" id="gQ"></div>
    <div class="g-board" id="gBoard"><button class="gp" style="--k:#1F9D57"><span></span></button><button class="gp" style="--k:#D93B3F"><span></span></button><button class="gp" style="--k:#E8A800"><span></span></button><button class="gp" style="--k:#2F7DE1"><span></span></button><div class="g-knob" id="gKnob"></div></div>
    <div class="g-st" id="gSt"></div>
  </div>
  <div class="hud"><button class="b" id="quitBtn" aria-label="Sair">✕</button><span class="pill" id="hearts"></span><span class="sp"></span><span class="pill" id="prog"></span><span class="pill">⭐ <span id="score">0</span></span><button class="b" id="bookBtn" aria-label="Reler o texto">📖</button></div>
  <div id="qcard" hidden><div id="qp"></div><div id="qq"></div></div>
  <div id="ghint" hidden></div>
  <div id="toast" hidden></div>
</div>

<div id="result" class="screen" hidden>
  <div class="res-stars" id="resStars"></div>
  <h1 id="resTitle"></h1>
  <div class="res-num" id="resNum"></div>
  <div class="res-box" id="resMist"></div>
  <div class="res-btns"><button class="cta" id="resNext"><span></span></button><button class="btn2" id="resAgain">🔁 Jogar este texto de novo</button><button class="btn2" id="resMap">🗺️ Voltar ao mapa</button></div>
</div>

<div id="confirm" hidden><div class="box"><h3 id="cfTitle"></h3><p id="cfText"></p><div class="row"><button class="btn2" id="cfNo"></button><button class="cta" id="cfYes" style="min-height:52px;font-size:16.5px"><span></span></button></div></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const plain=s=>String(s).replace(/\*\*/g,'');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* =========================================================
   BANDEIRAS (SVG simplificado, 60x40)
   ========================================================= */
function starPts(cx,cy,r){let p='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.4:r;p+=(cx+Math.cos(a)*q).toFixed(1)+','+(cy+Math.sin(a)*q).toFixed(1)+' '}return p}
const FL={
 BR:{n:'Brasil',em:'no Brasil',g:'brasileira',s:'<rect width="60" height="40" fill="#1F9E4A"/><path d="M30 4 55 20 30 36 5 20Z" fill="#F7D417"/><circle cx="30" cy="20" r="9.5" fill="#2A4FA3"/><path d="M21 17.5q9-2.5 18 3.5l-.6 2.2q-8.4-6-17.6-3.4z" fill="#fff"/>'},
 CA:{n:'Canadá',em:'no Canadá',g:'canadense',s:'<rect width="60" height="40" fill="#fff"/><rect width="15" height="40" fill="#D52B1E"/><rect x="45" width="15" height="40" fill="#D52B1E"/><path transform="translate(30.5 21) scale(.8) translate(-30.5 -21)" fill="#D52B1E" d="M30.5 6l3 6 4-2-1.5 9 5-4 1 3 5-1-2 5 3 2-9 6 1 4-8-1.5v4h-2v-4l-8 1.5 1-4-9-6 3-2-2-5 5 1 1-3 5 4-1.5-9 4 2z"/>'},
 CN:{n:'China',em:'na China',g:'chinesa',s:'<rect width="60" height="40" fill="#DE2910"/><polygon fill="#FFDE00" points="'+starPts(11,11,6.5)+'"/><polygon fill="#FFDE00" points="'+starPts(21,4.5,2.2)+'"/><polygon fill="#FFDE00" points="'+starPts(25,9,2.2)+'"/><polygon fill="#FFDE00" points="'+starPts(25,15,2.2)+'"/><polygon fill="#FFDE00" points="'+starPts(21,19.5,2.2)+'"/>'},
 JP:{n:'Japão',em:'no Japão',g:'japonesa',s:'<rect width="60" height="40" fill="#fff"/><circle cx="30" cy="20" r="11" fill="#BC002D"/>'},
 PT:{n:'Portugal',em:'em Portugal',g:'portuguesa',s:'<rect width="60" height="40" fill="#DA291C"/><rect width="24" height="40" fill="#046A38"/><circle cx="24" cy="20" r="8" fill="#FFE900"/><path d="M19.5 15.5h9v6q0 4-4.5 5.5-4.5-1.500-4.500-5.500z" fill="#DA291C" stroke="#fff" stroke-width="1.4"/>'},
 IT:{n:'Itália',em:'na Itália',g:'italiana',s:'<rect width="60" height="40" fill="#fff"/><rect width="20" height="40" fill="#009246"/><rect x="40" width="20" height="40" fill="#CE2B37"/>'},
 DE:{n:'Alemanha',em:'na Alemanha',g:'alemã',s:'<rect width="60" height="40" fill="#FFCE00"/><rect width="60" height="26.7" fill="#DD0000"/><rect width="60" height="13.3" fill="#111"/>'},
 ES:{n:'Espanha',em:'na Espanha',g:'espanhola',s:'<rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/><rect x="14" y="14.500" width="7" height="9" rx="1.5" fill="#AA151B" stroke="#7A5A00" stroke-width="1"/>'},
 LB:{n:'Líbano',em:'no Líbano',g:'libanesa',s:'<rect width="60" height="40" fill="#fff"/><rect width="60" height="10" fill="#ED1C24"/><rect y="30" width="60" height="10" fill="#ED1C24"/><path fill="#00A651" d="M30 11.500l6 6h-3l5 5h-4l5 4.500H21l5-4.500h-4l5-5h-3z"/><rect x="29" y="26" width="2" height="3" fill="#00A651"/>'},
 AR:{n:'Argentina',em:'na Argentina',g:'argentina',s:'<rect width="60" height="40" fill="#fff"/><rect width="60" height="13.3" fill="#74ACDF"/><rect y="26.7" width="60" height="13.3" fill="#74ACDF"/><circle cx="30" cy="20" r="4.2" fill="#F6B40E" stroke="#C98A00" stroke-width=".8"/>'},
 FR:{n:'França',em:'na França',g:'francesa',s:'<rect width="60" height="40" fill="#fff"/><rect width="20" height="40" fill="#0055A4"/><rect x="40" width="20" height="40" fill="#EF4135"/>'},
 AO:{n:'Angola',em:'em Angola',g:'angolana',s:'<rect width="60" height="40" fill="#111"/><rect width="60" height="20" fill="#CE1126"/><path d="M36 13a9 9 0 1 1-10 13" fill="none" stroke="#F9D616" stroke-width="2.6" stroke-linecap="round"/><polygon fill="#F9D616" points="'+starPts(29,17,3.6)+'"/>'}
};
const flag=k=>`<svg viewBox="0 0 60 40" role="img" aria-label="Bandeira: ${FL[k].n}">${FL[k].s}</svg>`;
const fq=(k,l)=>({flag:k,q:`Quem nasce **${FL[k].em}** tem nacionalidade…`,a:FL[k].g,w:shuffle(Object.keys(FL).filter(x=>x!==k&&FL[x].g!==FL[k].g)).map(x=>FL[x].g),l});
const Q=(q,a,w,l)=>({q,a,w,l});

/* =========================================================
   CONTEÚDO: missões -> textos curtos -> perguntas sobre o texto
   ========================================================= */
const MIS=[
{id:'nac',c:'var(--nac)',hex:'#2F7DE1',ico:'🌍',name:'A nacionalidade',game:'Genius das bandeiras',gid:'genius',texts:[
 {id:'nac1',title:'De onde você é?',s:[
  'Além do nome, a nossa identidade também tem a ver com o **lugar onde nascemos**. Isso é a **nacionalidade**.',
  'Quem nasce no Brasil tem nacionalidade **brasileira**.',
  'A **certidão de nascimento** é um dos documentos que comprovam a nacionalidade de uma pessoa.',
  'Veja no quadro o país e a nacionalidade de quem nasce nele:'],
  pairs:['BR','CA','CN','JP','PT','IT'],
  qs:()=>[fq('BR',3),fq('CA',3),fq('CN',3),fq('JP',3),fq('PT',3),fq('IT',3),
   Object.assign(Q('Que documento comprova a nacionalidade?','certidão de nascimento',['boletim da escola','carteira do clube','conta de luz'],2),{emo:'📄'}),
   Object.assign(Q('A nacionalidade tem a ver com o lugar onde…','nascemos',['estudamos','passeamos','brincamos'],0),{emo:'👶'})]},
 {id:'nac2',title:'Gente do mundo inteiro',s:[
  'O Brasil foi formado por muitos povos: os **indígenas**, que vivem aqui há milhares de anos, os **portugueses**, os **africanos** e os **imigrantes**.',
  '**Imigrantes** são pessoas que vieram de outros países para morar aqui, como alemães, espanhóis e libaneses.',
  'Veja no quadro o país e a nacionalidade de quem nasce nele:'],

const KEY='brasilCulturas.v1';
let S={q:{},t:{},mute:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.q)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function record(it,ok){const p=S.q[it.id]||(S.q[it.id]={s:0,r:0,l:1});p.s++;if(ok)p.r++;p.l=ok?1:0;save()}
const tinfo=t=>S.t[t.id]||{plays:0,best:0};
function mstat(m){const b=m.texts.map(t=>tinfo(t));if(b.every(x=>x.best===3))return'Dominado ⭐';if(b.some(x=>x.plays))return'Jogando';return'Novo'}
function nextText(after){const order=after?[...TEXTS.slice(TEXTS.indexOf(after)+1),...TEXTS.slice(0,TEXTS.indexOf(after))]:TEXTS;
  return order.find(t=>!tinfo(t).plays)||order.find(t=>tinfo(t).best<3)||order[0]}

/* =========================================================
   SOM E VOZ
   ========================================================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',vol=.15,delay=0,slide=0){
  if(S.mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function sfx(n){({ok:()=>{tone(660,.1,'triangle',.16);tone(990,.16,'triangle',.16,.09)},bad:()=>tone(160,.3,'sawtooth',.1,0,-70),pop:()=>tone(520,.05,'square',.06),
  coin:()=>tone(1200,.07,'triangle',.09),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.15,i*.11)),shoot:()=>tone(900,.18,'sine',.1,0,-600),
  thud:()=>tone(120,.12,'square',.14,0,-50),drum:()=>tone(150,.18,'sine',.3,0,-90)}[n]||(()=>{}))()}
function speak(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(t));u.lang='pt-BR';u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>/pt[-_]BR/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
const praise=()=>rnd(['Isso!','Muito bem!','Acertou!','Boa!','Mandou bem!','Show!']);

/* =========================================================
   TELAS: mapa
   ========================================================= */
function show(id){['home','result'].forEach(s=>$('#'+s).hidden=s!==id);$('#game').hidden=id!=='game';window.scrollTo(0,0)}
const starsHTML=n=>[0,1,2].map(i=>`<span class="${i<n?'':'off'}">⭐</span>`).join('');
function renderHome(){
  const played=TEXTS.filter(t=>tinfo(t).plays).length,st=TEXTS.reduce((a,t)=>a+tinfo(t).best,0),sug=nextText();
  $('#home').innerHTML=`<div class="hero"><h1>Brasil de Muitas Culturas</h1><p>História · Lições 12 e 13</p>
    <span class="tot">📖 ${played} de ${TEXTS.length} textos jogados · ⭐ ${st} de ${TEXTS.length*3}</span><div class="zig"></div></div>
   <div class="how">Leia o texto com atenção e depois jogue para responder!</div>`+
   MIS.map(m=>`<div class="mis" style="--c:${m.c}"><div class="mis-h"><span class="ico">${m.ico}</span><div><h2>${m.name}</h2><small>🎮 ${m.game}</small></div><span class="st">${mstat(m)}</span></div>
     ${m.texts.map(t=>{const i=tinfo(t);return `<button class="tx" data-t="${t.id}"><span class="n">${t.n}</span><span><b>${esc(t.title)}</b><span class="s">${i.plays?`<span class="stars">${starsHTML(i.best)}</span> · jogou ${i.plays}×`:'Ainda não jogou'}</span></span><span class="go">${t===sug?'👉 ':''}Ler e jogar ▶</span></button>`}).join('')}</div>`).join('')+
   `<div class="foot"><button id="muteBtn">${S.mute?'🔇 Som desligado':'🔊 Som ligado'}</button><button id="resetBtn">🗑️ Zerar progresso</button></div>`;
  $$('.tx').forEach(b=>b.onclick=()=>{ac();startText(b.dataset.t)});
  $('#muteBtn').onclick=()=>{S.mute=!S.mute;save();renderHome()};
  $('#resetBtn').onclick=()=>confirmBox('Zerar o progresso?','Isso apaga as estrelas e o que já foi jogado neste celular.','Cancelar','Zerar',()=>{S.q={};S.t={};save();renderHome()});
  show('home');
}

/* =========================================================
   LEITURA OBRIGATÓRIA (antes do jogo, para reler e quando erra muito)
   ========================================================= */
let rdTimer=0,rdCb=null;
function openRead(tid,mode,cb,lines){
  const t=TBY[tid],m=t.mis,el=$('#read');rdCb=cb;el.style.setProperty('--c',m.hex);
  $('#rdTag').textContent=m.ico+' '+m.name;
  $('#rdStep').textContent=mode==='start'?`Passo 1 de 2 · Leia o texto ${t.n}`:mode==='review'?'Vamos reler para continuar! Olhe as partes em amarelo.':'Releia e volte ao jogo';
  $('#rdTitle').textContent=t.title;
  $('#rdText').innerHTML=t.s.map((s,i)=>`<p class="${lines&&lines.has(i)?'hl':''}">${md(s)}</p>`).join('');
  $('#rdPairs').innerHTML=t.pairs?`<div class="pairs">${t.pairs.map(k=>`<div class="pair">${flag(k)}${FL[k].n}<b>${FL[k].g}</b></div>`).join('')}</div>`:'';
  $('#rdSay').onclick=()=>speak(t.s.join(' ')+(t.pairs?' '+t.pairs.map(k=>FL[k].n+': '+FL[k].g).join('. ')+'.':''));
  $('#rdX').hidden=mode==='review';
  $('#rdX').onclick=()=>{closeRead();if(mode==='start')renderHome();else if(rdCb){const c=rdCb;rdCb=null;c()}};
  const words=t.s.join(' ').split(/\s+/).length+(t.pairs?18:0);
  let secs=mode==='start'?Math.max(8,Math.min(20,words*.2)):mode==='review'?4:0;
  if(mode==='start'&&tinfo(t).plays)secs=Math.max(5,secs/2);
  if(window.__fast)secs=0;
  const go=$('#rdGo'),fill=go.querySelector('.fill'),label=mode==='start'?'▶ Começar o jogo':'▶ Voltar ao jogo';
  clearInterval(rdTimer);fill.style.transition='none';fill.style.width='0';
  if(secs>0){go.disabled=true;let left=Math.ceil(secs);$('#rdGoT').textContent=`Lendo… ${left}`;$('#rdMsg').textContent='📖 Leia com atenção: as perguntas do jogo são sobre este texto!';
    requestAnimationFrame(()=>{fill.style.transition=`width ${secs}s linear`;fill.style.width='100%'});
    rdTimer=setInterval(()=>{left--;if(left<=0){clearInterval(rdTimer);go.disabled=false;fill.style.transition='none';fill.style.width='0';$('#rdGoT').textContent=label;$('#rdMsg').textContent='Pronto! Já leu tudo?'}else $('#rdGoT').textContent=`Lendo… ${left}`},1000);
  }else{go.disabled=false;$('#rdGoT').textContent=label;$('#rdMsg').textContent=''}
  go.onclick=()=>{if(go.disabled)return;closeRead();const c=rdCb;rdCb=null;if(c)c()};
  el.hidden=false;el.scrollTop=0;
}
function closeRead(){clearInterval(rdTimer);hush();$('#read').hidden=true}
function startText(tid){openRead(tid,'start',()=>begin(tid))}

/* =========================================================
   RODADA (igual para todos os jogos)
   ========================================================= */
let R=null;
function begin(tid){
  const t=TBY[tid],m=t.mis;
  R={tid,t,m,idx:0,score:0,hearts:3,first:0,right:0,streak:0,wrong:[],pending:[],items:shuffle(t.items).map(i=>Object.assign({},i))};
  $('#game').style.setProperty('--c',m.hex);show('game');
  $('#qcard').hidden=true;$('#toast').hidden=true;$('#genius').hidden=true;$('#ghint').hidden=true;
  const mod=R.mod={genius:Genius,runner:Runner,catch:Catch,bow:Bow,drums:Drums}[m.gid];
  resize();hud();
  if(mod.canvas){$('#cv').hidden=false;loopStart(mod)}else{$('#cv').hidden=true;loopStop()}
  mod.start();if(mod.hint)showHint(mod.hint);
}
function hud(){if(!R)return;$('#hearts').textContent='❤️'.repeat(R.hearts)+'🤍'.repeat(3-R.hearts);
  $('#prog').textContent=Math.min(R.idx+1,R.items.length)+' / '+R.items.length;$('#score').textContent=R.score}
function optionsFor(it,n){return shuffle([it.a,...shuffle(it.w).slice(0,n-1)])}
function judge(it,ok){
  if(!it.retry){record(it,ok);R.first++;if(ok)R.right++}
  if(ok){R.streak++;R.score+=10+Math.min(R.streak,5)*2;sfx('ok')}
  else{R.streak=0;R.hearts=Math.max(0,R.hearts-1);R.pending.push(it);if(!it.retry){R.wrong.push(it);R.items.push(Object.assign({},it,{retry:true}))}sfx('bad');if(navigator.vibrate)try{navigator.vibrate(100)}catch(e){}}
  hud();
}
function advance(next){
  if(!R)return;R.idx++;
  if(R.hearts<=0){paused=true;const lines=new Set(R.pending.map(i=>i.l));R.pending=[];
    openRead(R.tid,'review',()=>{paused=false;last=performance.now();if(!R)return;R.hearts=3;hud();next()},lines)}
  else next();
}
function showQ(it){$('#qcard').hidden=false;$('#qp').textContent=(it.retry?'🔁 De novo · ':'')+`Pergunta ${R.idx+1}`;$('#qq').innerHTML=md(it.q);hud()}
let toastT=0;
function toast(html,kind='ok',sec=1.2){const t=$('#toast');t.innerHTML=html;t.className=kind;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,sec*1000)}
const wrongMsg=it=>`❌ A resposta certa é <b>${esc(it.a)}</b>`;
let hintT=0;
function showHint(t){const h=$('#ghint');h.textContent=t;h.hidden=false;clearTimeout(hintT);hintT=setTimeout(()=>h.hidden=true,4000)}
function finish(){
  if(!R)return;loopStop();if(R.mod.stop)R.mod.stop();
  const acc=R.first?R.right/R.first:0,stars=acc>=.9?3:acc>=.65?2:1,t=R.t;
  const ti=S.t[t.id]||(S.t[t.id]={plays:0,best:0});ti.plays++;ti.best=Math.max(ti.best,stars);save();
  $('#result').style.setProperty('--c',R.m.hex);
  $('#resStars').innerHTML=starsHTML(stars);$('#resTitle').textContent=['','Boa tentativa!','Muito bem!','Você arrasou!'][stars];
  $('#resNum').textContent=`${R.right} de ${R.first} certas de primeira · ${R.score} pontos`;
  const m=$('#resMist');
  if(R.wrong.length){m.hidden=false;m.innerHTML='<h3>📌 Para lembrar:</h3>'+R.wrong.map(it=>`<div>${md(it.q)} <b>${esc(it.a)}</b></div>`).join('')}else m.hidden=true;
  const nx=nextText(t),tid=t.id;
  $('#resNext').style.setProperty('--c',nx.mis.hex);$('#resNext span').textContent=`${nx.mis.ico} Próximo: ${nx.title} ▶`;
  $('#resNext').onclick=()=>startText(nx.id);$('#resAgain').onclick=()=>startText(tid);$('#resMap').onclick=()=>renderHome();
  R=null;show('result');if(stars===3){sfx('win');confetti()}
}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#F2A900','#1F9D57','#E5484D','#2F7DE1','#8E44AD','#fff'];
  for(let i=0;i<60;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=rnd(cols);p.style.animationDelay=Math.random()*.6+'s';p.style.animationDuration=1.4+Math.random()+'s';c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}
function confirmBox(title,text,no,yes,onYes,onNo){$('#cfTitle').textContent=title;$('#cfText').textContent=text;$('#cfNo').textContent=no;$('#cfYes span').textContent=yes;$('#confirm').hidden=false;
  $('#cfNo').onclick=()=>{$('#confirm').hidden=true;if(onNo)onNo()};$('#cfYes').onclick=()=>{$('#confirm').hidden=true;onYes()}}
$('#quitBtn').onclick=()=>{paused=true;confirmBox('Sair do jogo?','As respostas que você já deu ficam guardadas.','Continuar','Sair',()=>{loopStop();if(R&&R.mod.stop)R.mod.stop();R=null;paused=false;renderHome()},()=>{paused=false;last=performance.now()})};
$('#bookBtn').onclick=()=>{if(!R)return;paused=true;openRead(R.tid,'peek',()=>{paused=false;last=performance.now()})};

const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
const FONT="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif";
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',()=>{resize();if(R&&R.mod.onResize)R.mod.onResize()});
let raf=0,last=0,active=null,paused=false,timers=[];
function wait(s,fn){timers.push({t:s,fn})}
function loopStart(mod){active=mod;paused=false;timers=[];last=performance.now();cancelAnimationFrame(raf);
  const f=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;
    if(!paused&&active){for(const tm of timers.slice()){tm.t-=dt;if(tm.t<=0){timers.splice(timers.indexOf(tm),1);tm.fn()}}if(active&&active.update)active.update(dt)}
    if(active&&active.draw)active.draw();raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function loopStop(){cancelAnimationFrame(raf);active=null;timers=[]}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function wrapLines(c,text,maxW){const ws=String(text).split(' '),ls=[];let cur='';for(const w of ws){const t=cur?cur+' '+w:w;if(!cur||c.measureText(t).width<=maxW)cur=t;else{ls.push(cur);cur=w}}if(cur)ls.push(cur);return ls}
function fitText(c,text,maxW,maxH,start,min=11){for(let s=start;s>=min;s--){c.font=`900 ${s}px ${FONT}`;const ls=wrapLines(c,text,maxW);if(ls.every(l=>c.measureText(l).width<=maxW)&&ls.length*s*1.12<=maxH)return{s,ls}}
  c.font=`900 ${min}px ${FONT}`;return{s:min,ls:wrapLines(c,text,maxW)}}
function drawText(c,text,cx,cy,maxW,maxH,start,color){const f=fitText(c,text,maxW,maxH,start);c.fillStyle=color;c.textAlign='center';c.textBaseline='middle';
  const lh=f.s*1.12;f.ls.forEach((l,i)=>c.fillText(l,cx,cy-(f.ls.length-1)*lh/2+i*lh+1))}
const SC={n:['#FFFDF6','#2B2118'],ok:['#DDF5E4','#1F9D57'],bad:['#FDE3E3','#D93B3F']};
function sign(c,x,y,w,h,text,st='n',fs=21){c.fillStyle='rgba(0,0,0,.22)';rr(c,x+2,y+5,w,h,13);c.fill();rr(c,x,y,w,h,13);c.fillStyle=SC[st][0];c.fill();c.lineWidth=3.5;c.strokeStyle=SC[st][1];c.stroke();
  drawText(c,text,x+w/2,y+h/2,w-12,h-8,fs,'#2B2118')}
function burst(arr,x,y,col,n=16){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=120+Math.random()*260;arr.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,life:.9,col:Array.isArray(col)?rnd(col):col,r:3+Math.random()*5})}}
function updParts(arr,dt,g=600){for(const p of arr){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=g*dt;p.life-=dt}for(let i=arr.length-1;i>=0;i--)if(arr[i].life<=0)arr.splice(i,1)}
function drawParts(arr){for(const p of arr){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));ctx.fillStyle=p.col;circ(p.x,p.y,p.r)}ctx.globalAlpha=1}
function qBottom(){const q=$('#qcard');return q.hidden?70:q.getBoundingClientRect().bottom}
function tree(x,y,s){const c=ctx;c.fillStyle='rgba(0,0,0,.16)';c.beginPath();c.ellipse(x,y+s*.95,s*.8,s*.25,0,0,7);c.fill();c.fillStyle='#7A4B21';c.fillRect(x-s*.12,y,s*.24,s*.95);
  c.fillStyle='#2E7D46';circ(x,y-s*.25,s*.7);c.fillStyle='#3F9A52';circ(x-s*.38,y,s*.48);circ(x+s*.38,y,s*.48);c.fillStyle='#62BF72';circ(x-s*.15,y-s*.45,s*.34)}
function starShape(x,y,r,col){const c=ctx;c.fillStyle=col;c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();c.fill()}
function zigzag(y,h,cols){const c=ctx,n=Math.ceil(W/h)+1;c.fillStyle=cols[0];c.fillRect(0,y,W,h);c.fillStyle=cols[1];for(let i=0;i<n;i++){c.beginPath();c.moveTo(i*h,y+h);c.lineTo(i*h+h/2,y);c.lineTo(i*h+h,y+h);c.fill()}}

    this.deco=[];for(let i=0;i<9;i++)this.deco.push(this.mk(Math.random()*H));this.next()},
  tw(){return Math.min(W*.8,460)},tl(){return(W-this.tw())/2},laneX(i){return this.tl()+this.tw()*(i+.5)/3},py(){return H*.8},gh(){return 72},
  mk(y){return{y,side:Math.random()<.5?0:1,k:Math.random(),j:.3+Math.random()*.5}},
  next(){if(!R)return;if(R.idx>=R.items.length)return finish();const it=this.it=R.items[R.idx];showQ(it);
    let o=optionsFor(it,3).map(t=>({t,ok:t===it.a}));if(o.length<3)o.push({t:'',cone:true});o=shuffle(o);
    wait(Math.min(2.4,.8+it.q.length/30),()=>{this.gate={y:qBottom()-this.gh(),opts:o,hit:false}})},
  mv(d){const l=Math.max(0,Math.min(2,this.lane+d));if(l!==this.lane){this.lane=l;this.lean=d*.35;sfx('pop')}},
  down(x){this.d=x},move(){},up(x){if(this.d==null)return;const dx=x-this.d;this.mv(Math.abs(dx)>28?(dx>0?1:-1):(x<W/2?-1:1));this.d=null},
  key(k){if(k==='ArrowLeft')this.mv(-1);if(k==='ArrowRight')this.mv(1)},
  update(dt){const sp=this.speed,py=this.py();this.t+=dt;this.off=(this.off+sp*dt)%60;this.lean*=Math.pow(.02,dt);
    const tx=this.laneX(this.lane);if(this.px==null)this.px=tx;this.px+=(tx-this.px)*Math.min(1,dt*14);
    for(const d of this.deco){d.y+=sp*dt;if(d.y>H+60)Object.assign(d,this.mk(-60-Math.random()*120))}
    this.coinT-=dt;if(this.coinT<=0){this.coinT=.55;const g=this.gate;if(!g||g.hit||g.y>py-40)this.coins.push({lane:Math.floor(Math.random()*3),y:qBottom()})}

    this.coins=this.coins.filter(c=>c.y<H+30&&!c.got);

      if(!g.hit&&g.y+this.gh()>=py-24){g.hit=true;g.res=this.lane;const ch=g.opts[this.lane],ok=!!ch.ok;judge(this.it,ok);
        if(ok){this.speed=Math.min(H*.27,this.speed*1.05);burst(this.parts,this.px,py-30,['#F2A900','#fff','#1F9D57'],22);toast('✅ '+praise(),'ok',.9)}
        else{this.shake=.45;toast(wrongMsg(this.it),'bad',2.3)}
        wait(ok?1:2.4,()=>advance(()=>this.next()))}
      if(g.y>H+120)this.gate=null}

  draw(){const c=ctx,tl=this.tl(),tw=this.tw(),py=this.py();c.save();if(this.shake>0)c.translate((Math.random()-.5)*12,0);
    const gg=c.createLinearGradient(0,0,W,0);gg.addColorStop(0,'#58B368');gg.addColorStop(.5,'#6CC47A');gg.addColorStop(1,'#58B368');c.fillStyle=gg;c.fillRect(-20,0,W+40,H);
    c.fillStyle='#D9D2C5';c.fillRect(tl-12,0,tw+24,H);c.fillStyle='#BDB5A6';for(let y=-60+this.off;y<H;y+=30){c.fillRect(tl-12,y,12,2);c.fillRect(tl+tw,y,12,2)}

/* ---------- 🏹 ARCO E FLECHA (cultura indígena) ---------- */
const Bow={canvas:true,hint:'Puxe a flecha para trás, mire e solte!',

  next(){if(!R)return;if(R.idx>=R.items.length)return finish();const it=this.it=R.items[R.idx];showQ(it);

  reset(){const a=this.anchor();this.b={x:a.x,y:a.y,vx:0,vy:0,fly:false};this.drag=false},
  onResize(){if(this.tg){this.lay();if(this.b&&!this.b.fly)this.reset()}},
  G(){return H*1.2},

  arrow(c,len){c.strokeStyle='#8B5A2B';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.lineTo(len,0);c.stroke();

  draw(){const c=ctx,a=this.anchor(),gy=H*.9;

    s.forEach((p,i)=>this.later(800+i*650,()=>this.light(p,430)));
    this.later(800+s.length*650+150,()=>{this.mode='mem';this.k=0;b.classList.remove('lock');$('#gSt').textContent='Sua vez! Repita as cores.'})},
  memTap(i){if(i===this.ms[this.k]){this.light(i);this.k++;$('#gKnob').textContent=this.k+'/'+this.ms.length;
      if(this.k===this.ms.length){this.mode='wait';R.score+=15;hud();sfx('win');$('#gSt').textContent='🧠 Memória de campeão! +15';this.later(1200,()=>advance2(()=>this.next()))}}
    else{this.mode='wait';const p=this.pads[i];p.classList.remove('buzz');void p.offsetWidth;p.classList.add('buzz');tone(110,.3,'sawtooth',.1);$('#gSt').textContent='Quase! 😉 Vamos continuar.';this.later(1200,()=>advance2(()=>this.next()))}}
};
/* depois do desafio de memória a pergunta já foi contada: só segue em frente */
function advance2(next){advance(next)}

/* ---------- início ---------- */
document.addEventListener('pointerdown',()=>ac(),{once:true});
resize();renderHome();
</script>
