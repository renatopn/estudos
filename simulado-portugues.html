<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado de Português</title>
<style>
:root{
  --ink:#1F2433; --ink-soft:#5A6078; --paper:#F4F1EA; --card:#FFFFFF; --card-border:#E1DACB;
  --primary:#E0702A; --primary-dark:#B8561B; --blue:#2F6FB0; --blue-bg:#E4EEF9;
  --success:#2F8F4E; --success-bg:#E2F4E7; --danger:#C8432F; --danger-bg:#FBE5E0;
  --accent:#F2B705; --shadow:rgba(31,36,51,.14);
  --art:#2F6FB0; --sub:#D9822B; --adj:#3F8F4F;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#EFEDE8; --ink-soft:#B4B8C8; --paper:#14161E; --card:#1F2230; --card-border:#353A4E;
    --primary:#F08A45; --primary-dark:#C0632A; --blue:#6FA3DD; --blue-bg:#1B2A40;
    --success:#6CCB85; --success-bg:#16311F; --danger:#F08C78; --danger-bg:#3A1C17;
    --accent:#F2C94C; --shadow:rgba(0,0,0,.5);
    --art:#6FA3DD; --sub:#F0A85A; --adj:#6CCB85;
  }
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:var(--paper); color:var(--ink); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
button{font-family:inherit;}
p{margin:0 0 .6rem; line-height:1.55;}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:6px;}

#app{max-width:560px; margin:0 auto; padding:0 .85rem 3rem;}
.top{position:sticky; top:0; z-index:10; background:var(--paper); padding:.7rem 0 .6rem;}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.5rem;}
.brand{font-weight:900; font-size:1.05rem; color:var(--primary);}
.icon-btn{width:2.3rem; height:2.3rem; border-radius:50%; border:2px solid var(--card-border); background:var(--card); color:var(--ink); cursor:pointer; font-size:1.05rem; display:flex; align-items:center; justify-content:center; padding:0;}
.bar{height:.5rem; background:var(--card-border); border-radius:999px; overflow:hidden;}
.fill{height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:999px; transition:width .3s ease;}
.meta{display:flex; justify-content:space-between; align-items:center; margin-top:.45rem; font-size:.8rem; font-weight:700; color:var(--ink-soft);}
.chip-topic{background:var(--blue-bg); color:var(--blue); padding:.2rem .6rem; border-radius:999px; font-weight:800;}

.card{background:var(--card); border:2px solid var(--card-border); border-radius:1.1rem; padding:1rem; box-shadow:0 3px 0 var(--card-border); margin-top:.6rem;}
.kicker{font-size:.72rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--primary); margin-bottom:.35rem;}
.prompt{font-size:1.08rem; font-weight:800; line-height:1.4; margin-bottom:.9rem;}
.passage{background:var(--paper); border-radius:.8rem; padding:.85rem .9rem; font-size:1rem; line-height:1.65; white-space:pre-line;}
.passage mark{background:#FFE58A; color:#2A2000; font-weight:800; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; border-radius:.25rem; padding:0 .15rem;}
.evidence{margin-top:.8rem;}
.evidence-title{font-weight:800; color:var(--blue); margin-bottom:.4rem; line-height:1.4;}
.source{font-size:.78rem; color:var(--ink-soft); font-style:italic; margin-top:.5rem;}
details.reread{margin-bottom:.9rem;}
details.reread summary{cursor:pointer; font-weight:800; color:var(--blue); font-size:.9rem; padding:.3rem 0; list-style:none;}
details.reread summary::-webkit-details-marker{display:none;}
details.reread[open] summary{margin-bottom:.4rem;}

.opts{display:grid; gap:.55rem;}
.opt{background:var(--card); border:2px solid var(--card-border); border-radius:.9rem; padding:.8rem .95rem; text-align:left; font-weight:700; font-size:1rem; color:var(--ink); cursor:pointer; box-shadow:0 3px 0 var(--card-border); min-height:48px;}
.opt:disabled{cursor:default;}
.opt.sel{background:var(--blue-bg); border-color:var(--blue); color:var(--blue);}
.opt.ok{background:var(--success-bg); border-color:var(--success); color:var(--success);}
.opt.no{background:var(--danger-bg); border-color:var(--danger); color:var(--danger);}
.opt.dim{opacity:.5;}

.vf-list{display:grid; gap:.6rem;}
.vf-item{border:2px solid var(--card-border); border-radius:.9rem; padding:.7rem .8rem;}
.vf-item.ok{border-color:var(--success); background:var(--success-bg);}
.vf-item.no{border-color:var(--danger); background:var(--danger-bg);}
.vf-text{font-weight:700; margin-bottom:.5rem; line-height:1.4;}
.vf-btns{display:flex; gap:.5rem;}
.vf-btn{flex:1; min-height:44px; border-radius:.7rem; border:2px solid var(--card-border); background:var(--card); color:var(--ink); font-weight:900; font-size:1rem; cursor:pointer;}
.vf-btn.sel{background:var(--blue); border-color:var(--blue); color:#fff;}
.vf-btn:disabled{cursor:default;}
.vf-exp{font-size:.86rem; margin-top:.45rem; color:var(--ink); font-weight:600;}

textarea.answer{width:100%; min-height:6.5rem; border-radius:.8rem; border:2px solid var(--card-border); background:var(--paper); color:var(--ink); padding:.7rem; font-family:inherit; font-size:1rem; line-height:1.5; resize:vertical;}
textarea.answer:focus{outline:none; border-color:var(--blue);}
.self-q{font-weight:800; margin:.8rem 0 .5rem; text-align:center;}

.feedback{border-radius:.9rem; padding:.8rem .9rem; margin-top:.8rem; font-weight:600; line-height:1.45;}
.feedback.ok{background:var(--success-bg); color:var(--success);}
.feedback.no{background:var(--danger-bg); color:var(--danger);}
.feedback .fb-exp{color:var(--ink); display:block; margin-top:.2rem; font-size:.93rem;}

.btn{display:block; width:100%; border:none; border-radius:999px; padding:.85rem 1.2rem; font-weight:900; font-size:1rem; cursor:pointer; margin-top:.9rem;}
.btn:active{transform:translateY(2px);}
.btn:disabled{opacity:.45; cursor:default; transform:none;}
.btn-primary{background:var(--primary); color:#fff; box-shadow:0 4px 0 var(--primary-dark);}
.btn-secondary{background:var(--card); color:var(--ink); border:2px solid var(--card-border); box-shadow:0 4px 0 var(--card-border);}
.btn-row{display:flex; gap:.6rem;}
.btn-row .btn{flex:1;}
.btn-ok{background:var(--success); color:#fff;}
.btn-no{background:var(--danger); color:#fff;}

.tip h2{font-size:1.25rem; margin:0 0 .6rem;}
.tip ul{margin:0; padding-left:1.1rem;}
.tip li{margin-bottom:.5rem; line-height:1.5;}
.tip b{color:var(--primary);}

.sentence{font-size:1.2rem; line-height:2.5; margin:.3rem 0 .9rem;}
.word-chip{display:inline-block; border:2px dashed var(--ink-soft); background:var(--card); color:var(--ink); border-radius:.6rem; padding:0 .45rem; font-size:1.15rem; font-weight:800; cursor:pointer; line-height:1.9; margin:0 .08rem;}
.word-chip.sel{border-style:solid; border-color:var(--accent); background:var(--accent); color:#3a2a00;}
.word-chip.art{border-style:solid; border-color:var(--art); background:var(--art); color:#fff;}
.word-chip.sub{border-style:solid; border-color:var(--sub); background:var(--sub); color:#fff;}
.word-chip.adj{border-style:solid; border-color:var(--adj); background:var(--adj); color:#fff;}
.word-chip.sel.art,.word-chip.sel.sub,.word-chip.sel.adj{outline:3px solid var(--accent); outline-offset:2px;}
.class-btns{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem;}
.class-btn{min-height:52px; border:none; border-radius:.8rem; color:#fff; font-weight:900; font-size:.95rem; cursor:pointer;}
.class-btn.art{background:var(--art);} .class-btn.sub{background:var(--sub);} .class-btn.adj{background:var(--adj);}
.class-btn:disabled{opacity:.4; cursor:default;}
.hint{font-size:.85rem; color:var(--ink-soft); font-weight:600; margin-bottom:.6rem;}
.legend{display:flex; gap:.8rem; flex-wrap:wrap; font-size:.8rem; font-weight:700; margin-top:.7rem; color:var(--ink-soft);}
.legend span::before{content:""; display:inline-block; width:.7rem; height:.7rem; border-radius:3px; margin-right:.3rem; vertical-align:-1px; background:currentColor;}
.legend .l-art{color:var(--art);} .legend .l-sub{color:var(--sub);} .legend .l-adj{color:var(--adj);}

.start h1{font-size:1.6rem; margin:.2rem 0 .5rem; color:var(--primary);}
.start ul{padding-left:1.1rem; margin:.4rem 0 0;}
.start li{margin-bottom:.35rem; line-height:1.45;}

.res-row{margin-bottom:.75rem;}
.res-top{display:flex; justify-content:space-between; font-weight:800; font-size:.92rem; margin-bottom:.25rem;}
.res-bar{height:.6rem; background:var(--card-border); border-radius:999px; overflow:hidden;}
.res-fill{height:100%; border-radius:999px;}
.big-score{text-align:center; font-size:2.6rem; font-weight:900; color:var(--primary); margin:.3rem 0;}
.stars{text-align:center; font-size:2rem; letter-spacing:.3rem;}
.review{background:var(--danger-bg); border-radius:.8rem; padding:.7rem .85rem; margin-top:.8rem; font-weight:600;}

/* ===== REVISÃO ===== */
.rev-tabs{display:flex; gap:.5rem; margin-top:.8rem;}
.rev-tabs .btn{margin-top:0; padding:.6rem .8rem; font-size:.9rem;}
.rev-tabs .btn.active{background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:none;}
.rev-item{background:var(--card); border:2px solid var(--card-border); border-left:6px solid var(--success); border-radius:.9rem; padding:.8rem .9rem; margin-top:.6rem;}
.rev-item.wrong{border-left-color:var(--danger);}
.rev-head{display:flex; justify-content:space-between; gap:.5rem; font-size:.78rem; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:.35rem;}
.rev-q{font-weight:800; margin-bottom:.45rem; line-height:1.4;}
.rev-line{font-size:.93rem; line-height:1.5; margin:.15rem 0;}
.rev-line .lbl{font-weight:800; color:var(--ink-soft);}
.rev-line.good{color:var(--success);} .rev-line.bad{color:var(--danger);}
.rev-answer{background:var(--paper); border-radius:.6rem; padding:.5rem .65rem; margin:.25rem 0 .4rem; white-space:pre-wrap; font-size:.95rem;}
.rev-note{font-size:.85rem; color:var(--ink-soft); margin-top:.35rem; line-height:1.45;}
.rev-note mark{background:#FFE58A; color:#2A2000; border-radius:.2rem; padding:0 .15rem;}
.rev-vf{border-top:1px dashed var(--card-border); padding-top:.35rem; margin-top:.35rem;}
@media print{ .top, .rev-tabs, .no-print{display:none !important;} body{background:#fff; color:#000;} .rev-item{break-inside:avoid;} }

/* ===== SHOOTER ===== */
#shooter{position:fixed; inset:0; z-index:50; background:#0B1026; display:none; flex-direction:column; padding:.55rem .55rem .45rem; color:#fff;}
#shooter.open{display:flex;}
.sh-top{display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:.85rem; margin-bottom:.35rem; gap:.5rem;}
.sh-skip{background:rgba(255,255,255,.12); color:#fff; border:none; border-radius:999px; padding:.3rem .7rem; font-weight:700; cursor:pointer; font-size:.78rem;}
.sh-cmd{text-align:center; background:linear-gradient(90deg,#E0702A,#F2B705); color:#1F1300; border-radius:.8rem; padding:.45rem .6rem; margin-bottom:.4rem;}
.sh-cmd small{display:block; font-size:.68rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.8;}
.sh-cmd b{font-size:1.25rem; font-weight:900;}
.sh-cmd.flash{animation:flash .6s 2;}
@keyframes flash{50%{transform:scale(1.06); box-shadow:0 0 0 4px rgba(255,255,255,.5);}}
.sh-wrap{position:relative; flex:1 1 auto; min-height:0; border-radius:.9rem; overflow:hidden; touch-action:none; border:2px solid rgba(255,255,255,.15);}
#sh-canvas{display:block; width:100%; height:100%;}
.sh-hint{text-align:center; font-size:.74rem; opacity:.75; margin-top:.35rem; font-weight:600;}
.sh-over{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:.4rem; background:rgba(8,10,24,.82); text-align:center; padding:1.2rem;}
.sh-over.show{display:flex;}
.sh-over h2{margin:0; font-size:1.5rem;}
.sh-over p{margin:0; font-size:1rem;}
.sh-over .btn{max-width:280px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <span class="brand">📝 Simulado de Português</span>
      <button class="icon-btn" id="restart" aria-label="Recomeçar simulado" title="Recomeçar simulado">↺</button>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span class="chip-topic" id="topic-chip">Início</span><span id="counter"></span></div>
  </header>
  <main id="screen"></main>
</div>

<div id="shooter">
  <div class="sh-top">
    <span id="sh-lives"></span>
    <span id="sh-score"></span>
    <button class="sh-skip" id="sh-skip">Pular jogo ⏭</button>
  </div>
  <div class="sh-cmd" id="sh-cmd"><small>Acerte só as palavras da classe:</small><b id="sh-cmd-text"></b></div>
  <div class="sh-wrap" id="sh-wrap">
    <canvas id="sh-canvas"></canvas>
    <div class="sh-over" id="sh-over">
      <h2 id="sh-over-title"></h2>
      <p id="sh-over-text"></p>
      <button class="btn btn-primary" id="sh-back">Voltar ao simulado</button>
      <button class="btn btn-secondary" id="sh-again">Jogar de novo</button>
    </div>
  </div>
  <div class="sh-hint">Toque embaixo da palavra certa para mover o foguete e atirar ⚡ (no teclado: ← → e espaço)</div>
</div>

<script>
"use strict";
/* ================= TEXTOS ================= */
const TEXTS = {
  fabula:{
    title:'A lebre e a tartaruga',
    source:'Fábula de Esopo (adaptação)',
    body:`Numa floresta, a lebre vivia se gabando de ser o animal mais veloz de todos. Um dia, a tartaruga, cansada de ouvir tanta vaidade, desafiou a lebre para uma corrida. Os bichos riram muito, mas a corrida foi marcada.

Logo na largada, a lebre disparou e deixou a tartaruga para trás. Confiante, resolveu tirar um cochilo embaixo de uma árvore. Enquanto isso, a tartaruga seguia devagar, passo a passo, sem parar nem um minuto.

Quando a lebre acordou, correu o mais rápido que pôde, mas era tarde: a tartaruga já cruzava a linha de chegada, aplaudida por todos os animais.

Moral da história: devagar e sempre se chega na frente.`
  },
  sitio:{
    title:'Uma manhã no Sítio',
    source:'Inspirado no Sítio do Picapau Amarelo, de Monteiro Lobato (adaptação)',
    body:`Numa manhã ensolarada no Sítio do Picapau Amarelo, Narizinho acordou com um barulho no quintal. Era a Emília, a boneca de pano mais falante do mundo, correndo atrás de um sapinho verde.

— Volta aqui, bichinho! Quero te fazer uma pergunta! — gritava a boneca.

O Visconde de Sabugosa, sábio como sempre, ajeitou a cartola e explicou:

— Emília, sapos não respondem perguntas.

— Isso é porque ninguém nunca perguntou direito! — retrucou ela.

Tia Nastácia riu lá da cozinha, enquanto tirava do forno um bolo quentinho de fubá. No fim, o sapinho pulou no riacho e desapareceu, e a turma toda correu para a mesa.`
  },
  hobbit:{
    title:'Enigmas no escuro',
    source:'Adaptado de um capítulo de O Hobbit, de J. R. R. Tolkien',
    body:`Bilbo Bolseiro estava perdido nos túneis escuros da montanha. Tateando o chão frio, encontrou um pequeno anel dourado e o guardou no bolso, sem pensar muito.

Mais adiante, chegou à margem de um lago subterrâneo. Ali vivia Gollum, uma criatura magra, de olhos grandes e brilhantes, que falava sozinha. Gollum propôs um jogo de adivinhas: se Bilbo vencesse, ele mostraria a saída; se perdesse, seria devorado!

Os dois trocaram enigmas por um longo tempo. Por fim, sem ideias, Bilbo fez uma pergunta que nem era uma adivinha de verdade:

— O que eu tenho no meu bolso?

Gollum não soube responder e ficou furioso. Foi assim que o hobbit escapou, levando consigo o anel misterioso.`
  }
};

/* ================= TEMAS E DICAS ================= */
const TOPICS = {
  interp:'Interpretação de texto', genero:'Flexão de gênero', letraR:'Uso da letra R',
  grau:'Grau do substantivo', acent:'Acentuação', artigo:'Artigo',
  adjetivo:'Adjetivo', numeral:'Numerais', classes:'Classes de palavras'
};
const TIPS = {
  interp:{title:'📖 Como responder interpretação', items:[
    'Leia o texto <b>com calma</b>, do começo ao fim.',
    'Muitas respostas estão <b>escritas no próprio texto</b>: volte nele para conferir.',
    'Nas respostas escritas, use <b>frases completas</b> e explique com suas palavras.',
    'Se precisar, toque em <b>"Reler o texto"</b> em cada pergunta.'
  ]},
  genero:{title:'♂♀ Relembre: flexão de gênero', items:[
    '<b>Masculino</b>: aceita <i>o, os, um, uns</i>. <b>Feminino</b>: aceita <i>a, as, uma, umas</i>.',
    'Regra mais comum: trocar <b>-o por -a</b> (menino → menina).',
    'Outros padrões: <b>-ão → -oa, -ona, -ã</b> (leão → leoa, irmão → irmã) · <b>-or → -ora</b> (cantor → cantora) · <b>-e → -a</b> (mestre → mestra) · <b>-ês → -esa</b> (marquês → marquesa).',
    'Casos especiais: galo → galinha · ator → atriz · herói → heroína · príncipe → princesa · imperador → imperatriz · boi → vaca · pai → mãe.',
    'Uma forma só: <b>comum de dois gêneros</b> (o/a jovem: o artigo mostra o gênero), <b>sobrecomum</b> (a criança: pessoas dos dois sexos) e <b>epiceno</b> (baleia-macho, baleia-fêmea: animais).',
    'Terminações: são masculinos muitos terminados em <b>-é, -l, -r, -s</b> (café, anzol, açúcar, lápis) e os nomes de <b>meses, rios, mares</b>. São femininos muitos terminados em <b>-ã, -dade, -ice, -gem</b> (maçã, cidade, velhice, viagem). Há exceções: maré, cometa, dia, planeta.'
  ]},
  letraR:{title:'🔤 Relembre: usos da letra R', items:[
    'No <b>início da palavra</b>, o R tem som <b>forte</b>: rato, rua, rio.',
    '<b>Entre vogais</b>, um só <b>r</b> tem som <b>fraco</b>: arara, barata, aurora.',
    'Para ter som <b>forte entre vogais</b>, usamos <b>rr</b>: carro, terra.',
    'O <b>rr</b> é um <b>dígrafo</b> (duas letras, um só som). Na separação silábica, cada <b>r</b> fica numa sílaba: car-ro, ter-ra.'
  ]},
  grau:{title:'🐕 Relembre: grau do substantivo', items:[
    '<b>Normal</b>: cachorro · <b>Diminutivo</b>: cachorrinho (ideia de redução) · <b>Aumentativo</b>: cachorrão (ideia de algo grande, forte).',
    'Terminações do diminutivo: <b>-inho/-zinho</b> (filhinho, florzinha), <b>-acho</b> (riacho), <b>-ejo</b> (vilarejo), <b>-ela</b> (ruela), <b>-eta/-eto</b> (maleta, livreto), <b>-ico</b> (burrico), <b>-ota</b> (ilhota), <b>-ote</b> (caixote).',
    'O grau também mostra <b>carinho</b> (mãezinha, amigão) ou <b>desprezo</b> ("Que ideiazinha a sua!").'
  ]},
  acent:{title:'´ Relembre: regras de acentuação', items:[
    'Acentos: <b>agudo</b> ( ´ ) e <b>circunflexo</b> ( ^ ).',
    '1ª regra: <b>monossílabos tônicos</b> terminados em <b>-a(s), -e(s), -o(s)</b> levam acento: já, pá, pé, três, mês, pó, nós, só.',
    'Monossílabos tônicos terminados em <b>-i</b> e <b>-u</b> <b>não</b> levam acento: tu, nu, cru.',
    '2ª regra: <b>oxítonas</b> (a sílaba mais forte é a última) terminadas em <b>-a(s), -e(s), -o(s), -em, -ens</b> levam acento: cajá, café, você, avós, dominó, também, parabéns.',
    'Oxítonas terminadas em <b>-i</b> e <b>-u</b> não levam acento: caqui, urubu, jabuti.'
  ]},
  artigo:{title:'🔎 Relembre: artigos', items:[
    'Artigos vêm <b>antes do substantivo</b> e indicam seu <b>gênero</b> e <b>número</b>.',
    '<b>Definidos</b> (algo específico, conhecido): <b>o, a, os, as</b> — <i>o carro</i>.',
    '<b>Indefinidos</b> (algo qualquer, genérico): <b>um, uma, uns, umas</b> — <i>um carro</i>.',
    'Atenção: <b>um/uma</b> são <b>numerais</b> quando indicam quantidade ("Tomei um copo de água e o Antônio, dois").',
    'Artigo junto com preposição: de + o = <b>do</b> · em + a = <b>na</b> · a + o = <b>ao</b>.'
  ]},
  adjetivo:{title:'✨ Relembre: adjetivos', items:[
    '<b>Adjetivo</b> expressa uma característica do substantivo: menino <i>estudioso</i>, noite <i>chuvosa</i>.',
    '<b>Adjetivo pátrio</b> indica a origem: Brasil → brasileiro · Inglaterra → inglês · São Paulo → paulista · Pérsia → persa.',

/* ================= HELPERS ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!=null) e.innerHTML = html;
  return e;
}

/* ================= BUILD STEPS ================= */
function buildSteps(){
  const steps = [];
  const topicsSoFar = [];
  let qCount = 0;
  SEQ.forEach(item=>{
    if(item.t==='read'){ steps.push({kind:'read', text:item.text}); return; }
    if(item.t==='tip'){ steps.push({kind:'tip', topic:item.topic}); return; }
    qCount++;
    steps.push({kind:'q', q:item, n:qCount});
    topicsSoFar.push(item.topic);
    if(qCount % 10 === 0){
      const recent = topicsSoFar.slice(-10).filter(t=>t!=='interp');
      const counts = {};
      recent.forEach(t=>counts[t]=(counts[t]||0)+1);
      let best = null, bestN = -1;
      recent.forEach(t=>{ if(counts[t]>=bestN){ bestN=counts[t]; best=t; } });
      if(best && SHOOTER_POOLS[best]) steps.push({kind:'break', topic:best});
    }
  });
  steps.push({kind:'tip', topic:'classes'});
  CLASSIFY.forEach((_,i)=>steps.push({kind:'classify', i}));
  steps.push({kind:'end'});
  return {steps, total:qCount};
}
const BUILT = buildSteps();
const STEPS = BUILT.steps;
const TOTAL_Q = BUILT.total;

/* ================= STATE ================= */
const KEY = 'simuladoPortuguesSet2026v1';
function freshState(){ return {pos:0, stats:{}, game:{hits:0, errors:0}, answers:{}}; }
function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(typeof s.pos==='number' && s.pos < STEPS.length){ s.answers = s.answers || {}; return s; }
    }
  }catch(e){}
  return freshState();
}
function saveState(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let state = loadState();
let pending = [];
let pendingAnswer = null;

function advance(){
  pending.forEach(r=>{
    const s = state.stats[r.topic] || (state.stats[r.topic] = {ok:0, total:0});
    s.total++;
    if(r.ok) s.ok++;
  });
  if(pendingAnswer) state.answers[state.pos] = pendingAnswer;
  pending = [];
  pendingAnswer = null;
  state.pos = Math.min(state.pos+1, STEPS.length-1);
  saveState();
  render();
}

/* ================= HEADER ================= */
function lastQuestionNumber(pos){
  for(let i=pos;i>=0;i--) if(STEPS[i].kind==='q') return STEPS[i].n;
  return 0;
}
function updateHeader(step){
  document.getElementById('fill').style.width = Math.round(100*state.pos/(STEPS.length-1))+'%';
  const chip = document.getElementById('topic-chip');
  const counter = document.getElementById('counter');
  if(!step){ chip.textContent='Início'; counter.textContent = TOTAL_Q+' questões'; return; }
  switch(step.kind){
    case 'q': chip.textContent = TOPICS[step.q.topic]; counter.textContent = 'Questão '+step.n+' de '+TOTAL_Q; break;
    case 'read': chip.textContent = 'Leitura'; counter.textContent = 'Antes da questão '+(lastQuestionNumber(state.pos)+1); break;
    case 'tip': chip.textContent = TOPICS[step.topic]; counter.textContent = step.topic==='classes' ? 'Fase final' : 'Relembre'; break;
    case 'break': chip.textContent = 'Jogo bônus 🚀'; counter.textContent = 'Depois da questão '+lastQuestionNumber(state.pos); break;
    case 'classify': chip.textContent = TOPICS.classes; counter.textContent = 'Frase '+(step.i+1)+' de '+CLASSIFY.length; break;
    case 'end': chip.textContent = 'Resultado'; counter.textContent = 'Fim! 🎉'; break;
  }
}

/* ================= RENDER ================= */
const screen = document.getElementById('screen');
function render(){
  pending = [];
  pendingAnswer = null;
  const step = STEPS[state.pos];
  updateHeader(step);
  screen.innerHTML = '';
  switch(step.kind){
    case 'q':
      if(step.q.t==='mc') renderMC(step.q);
      else if(step.q.t==='vf') renderVF(step.q);
      else renderOpen(step.q);
      break;
    case 'read': renderRead(step); break;
    case 'tip': renderTip(step); break;
    case 'break': renderBreak(step); break;
    case 'classify': renderClassify(step); break;
    case 'end': renderEnd(); break;
  }
  window.scrollTo(0,0);
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function evidenceBlock(textId, phrases, title){
  const box = el('div','evidence');
  box.appendChild(el('div','evidence-title', title));
  let html = escapeHtml(TEXTS[textId].body);
  phrases.forEach(ph=>{
    const e = escapeHtml(ph);
    const i = html.indexOf(e);
    if(i>=0) html = html.slice(0,i)+'<mark>'+e+'</mark>'+html.slice(i+e.length);
  });
  const p = el('div','passage', html);
  box.appendChild(p);
  return box;
}
function showEvidence(card, holder, block){
  if(holder.el) holder.el.replaceWith(block); else card.appendChild(block);
  holder.el = block;
  block.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderMC(q){
  if(q.hl) return renderMCInterp(q);
  const card = el('div','card');
  card.appendChild(el('div','kicker', 'Múltipla escolha'));
  if(q.text) card.appendChild(rereadBlock(q.text));
  const prompt = el('div','prompt'); prompt.textContent = q.q;
  card.appendChild(prompt);
  const opts = el('div','opts');
  const confirm = el('button','btn btn-primary','Confirmar resposta ➜');
  confirm.disabled = true;
  let chosen = null;
  const buttons = [];
  shuffle(q.o.map((_,i)=>i)).forEach(idx=>{
    const b = el('button','opt'); b.textContent = q.o[idx];
    b.addEventListener('click', ()=>{
      chosen = idx;
      buttons.forEach(bb=>bb.classList.toggle('sel', bb===b));
      confirm.disabled = false;
    });
    buttons.push(b); opts.appendChild(b);
  });
  confirm.addEventListener('click', ()=>{
    pending = [{topic:q.topic, ok: chosen===q.c}];
    pendingAnswer = {chosen:[chosen]};
    advance();
  });
  card.appendChild(opts); card.appendChild(confirm);
  screen.appendChild(card);
}

function renderMCInterp(q){
  const card = el('div','card');
  card.appendChild(el('div','kicker', 'Múltipla escolha'));
  card.appendChild(rereadBlock(q.text));
  const prompt = el('div','prompt'); prompt.textContent = q.q;
  card.appendChild(prompt);
  const opts = el('div','opts');
  const fb = el('div','feedback'); fb.style.display='none';
  const cont = continueButton(); cont.style.display='none';
  const evidence = {el:null};
  const buttons = [];
  let firstTry = true;
  const attempts = [];
  shuffle(q.o.map((_,i)=>i)).forEach(idx=>{
    const b = el('button','opt'); b.textContent = q.o[idx];
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      const ok = idx===q.c;
      attempts.push(idx);
      pendingAnswer = {chosen:attempts.slice()};
      if(firstTry){ pending = [{topic:q.topic, ok}]; firstTry = false; }
      if(ok){
        buttons.forEach(bb=>{ bb.disabled = true; if(bb!==b && !bb.classList.contains('no')) bb.classList.add('dim'); });
        b.classList.add('ok');
        fb.className = 'feedback ok'; fb.textContent = 'Isso mesmo! ✅';
        fb.style.display = 'block';
        showEvidence(card, evidence, evidenceBlock(q.text, q.hl, 'Veja no texto onde está a resposta:'));
        card.appendChild(cont); cont.style.display = 'block';
      } else {
        b.disabled = true; b.classList.add('no');
        fb.className = 'feedback no'; fb.textContent = 'Ainda não! Releia o trecho destacado no texto e escolha outra alternativa.';
        fb.style.display = 'block';
        showEvidence(card, evidence, evidenceBlock(q.text, q.hl, '📖 O trecho destacado ajuda a responder:'));
      }
    });
    buttons.push(b); opts.appendChild(b);
  });
  card.appendChild(opts); card.appendChild(fb);
  screen.appendChild(card);
}

function renderVFInterp(q){
  const card = el('div','card');
  card.appendChild(el('div','kicker','Verdadeiro ou falso'));
  card.appendChild(rereadBlock(q.text));
  card.appendChild(el('div','prompt','Marque <b>V</b> (verdadeiro) ou <b>F</b> (falso) em cada frase:'));
  const list = el('div','vf-list');
  const rows = q.items.map(it=>{
    const r = {it, sel:null, locked:false};
    r.row = el('div','vf-item');
    const txt = el('div','vf-text'); txt.textContent = it.s;
    const btns = el('div','vf-btns');
    r.bV = el('button','vf-btn','V'); r.bF = el('button','vf-btn','F');
    r.bV.setAttribute('aria-label','Verdadeiro'); r.bF.setAttribute('aria-label','Falso');
    const pick = val=>{
      if(r.locked) return;
      r.sel = val;
      r.bV.classList.toggle('sel', val===true);
      r.bF.classList.toggle('sel', val===false);
      r.row.classList.remove('no');
      check.disabled = rows.some(x=>x.sel===null);
    };
    r.bV.addEventListener('click', ()=>pick(true));
    r.bF.addEventListener('click', ()=>pick(false));
    btns.appendChild(r.bV); btns.appendChild(r.bF);
    r.exp = el('div','vf-exp'); r.exp.style.display='none';
    r.row.appendChild(txt); r.row.appendChild(btns); r.row.appendChild(r.exp);
    list.appendChild(r.row);
    return r;
  });
  const check = el('button','btn btn-primary','Conferir respostas');
  check.disabled = true;
  const fb = el('div','feedback'); fb.style.display='none';
  const cont = continueButton(); cont.style.display='none';
  const evidence = {el:null};
  let firstTry = true;
  check.addEventListener('click', ()=>{
    const wrong = [];
    if(firstTry) pendingAnswer = {sel: rows.map(r=>r.sel)};
    rows.forEach(r=>{
      if(r.locked) return;
      const ok = r.sel===r.it.v;
      if(firstTry) pending.push({topic:q.topic, ok});
      r.exp.style.display = 'block';
      if(ok){
        r.locked = true;
        r.bV.disabled = true; r.bF.disabled = true;
        r.row.classList.remove('no'); r.row.classList.add('ok');
        r.exp.textContent = '✅ Correto!';
      } else {
        wrong.push(r);
        r.row.classList.add('no');
        r.exp.textContent = '❌ Ainda não. Releia o trecho destacado e mude sua resposta.';
      }
    });
    firstTry = false;
    if(wrong.length){
      check.textContent = 'Conferir de novo';
      fb.className = 'feedback no';
      fb.textContent = 'Algumas frases ainda não estão certas. Os trechos destacados no texto abaixo ajudam a descobrir.';
      showEvidence(card, evidence, evidenceBlock(q.text, wrong.map(r=>r.it.hl), '📖 Releia os trechos destacados:'));
    } else {
      check.style.display = 'none';
      fb.className = 'feedback ok';
      fb.textContent = 'Muito bem! Todas as frases estão certas ✅';

function parseClassify(src){
  const parts = [];
  const re = /\[([^|\]]+)\|(art|sub|adj)\]/g;
  let last = 0, m;
  while((m = re.exec(src))){
    if(m.index>last) parts.push({plain: src.slice(last, m.index)});
    parts.push({word:m[1], cls:m[2]});
    last = re.lastIndex;
  }
  if(last<src.length) parts.push({plain: src.slice(last)});
  return parts;
}

/* ================= REVISÃO PARA O ADULTO ================= */
function vfLabel(v){ return v===true ? 'V' : v===false ? 'F' : '—'; }
function revLine(label, text, cls){
  const d = el('div','rev-line'+(cls?' '+cls:''));
  d.appendChild(el('span','lbl', label+' '));
  d.appendChild(document.createTextNode(text));
  return d;
}
function quoteHl(phrases){
  return '<b>Trecho do texto:</b> ' + phrases.map(p=>'<mark>'+escapeHtml(p)+'</mark>').join(' … ');
}

function reviewQuestion(step, ans){
  const q = step.q;
  const item = el('div','rev-item');
  let wrong = false;
  const head = el('div','rev-head');
  const qText = el('div','rev-q');
  item.appendChild(head); item.appendChild(qText);

  if(q.t==='mc'){
    qText.textContent = q.q;
    const chosen = ans ? ans.chosen : [];
    const first = chosen[0];
    wrong = first!==q.c;
    item.appendChild(revLine('Resposta:', first!=null ? q.o[first] : 'não respondeu', wrong?'bad':'good'));
    if(chosen.length>1) item.appendChild(revLine('Tentativas depois de reler o texto:', chosen.slice(1).map(i=>q.o[i]).join(' → ')));
    if(wrong) item.appendChild(revLine('Correta:', q.o[q.c], 'good'));
    item.appendChild(el('div','rev-note', q.hl ? quoteHl(q.hl) : escapeHtml(q.e)));
  } else if(q.t==='vf'){
    qText.textContent = 'Verdadeiro ou falso:';
    const sel = ans ? ans.sel : [];
    q.items.forEach((it,i)=>{
      const ok = sel[i]===it.v;
      if(!ok) wrong = true;
      const box = el('div','rev-vf');
      box.appendChild(el('div','rev-line', escapeHtml(it.s)));
      box.appendChild(revLine('Marcou:', vfLabel(sel[i])+(ok?' ✅':' ❌  (correto: '+vfLabel(it.v)+')'), ok?'good':'bad'));
      box.appendChild(el('div','rev-note', it.hl ? quoteHl([it.hl]) : escapeHtml(it.e)));
      item.appendChild(box);
    });
  } else {
    qText.textContent = q.q;
    wrong = !(ans && ans.self);
    item.appendChild(el('div','rev-line','<span class="lbl">Resposta escrita:</span>'));
    const a1 = el('div','rev-answer'); a1.textContent = ans ? ans.first : '(não respondeu)';
    item.appendChild(a1);
    if(ans && ans.final && ans.final!==ans.first){
      item.appendChild(el('div','rev-line','<span class="lbl">Depois de reler o texto, melhorou para:</span>'));
      const a2 = el('div','rev-answer'); a2.textContent = ans.final;
      item.appendChild(a2);
    }
    item.appendChild(revLine('Autoavaliação do aluno:', ans ? (ans.self ? '✅ disse que acertou' : '❌ disse que precisa revisar') : '—', ans && ans.self ? 'good' : 'bad'));
    item.appendChild(revLine('Resposta de referência:', q.ref));
    item.appendChild(el('div','rev-note', quoteHl(q.hl)));
  }

  head.innerHTML = '<span>Questão '+step.n+' · '+escapeHtml(TOPICS[q.topic])+'</span><span>'+(q.t==='open' ? '✍️ conferir' : wrong ? '❌' : '✅')+'</span>';
  if(wrong) item.classList.add('wrong');
  return {item, wrong};
}

function reviewClassify(step, ans){
  const parts = parseClassify(CLASSIFY[step.i]);
  const words = parts.filter(p=>p.plain==null);
  const assign = ans ? ans.assign : [];
  const item = el('div','rev-item');
  const wrongWords = words.filter((w,k)=>assign[k]!==w.cls);
  const wrong = wrongWords.length>0;
  item.appendChild(el('div','rev-head','<span>Frase '+(step.i+1)+' · Classes de palavras</span><span>'+(wrong?'❌':'✅')+'</span>'));
  const sentence = el('div','rev-q');
  sentence.textContent = parts.map(p=>p.plain!=null ? p.plain : p.word).join('');
  item.appendChild(sentence);
  words.forEach((w,k)=>{
    const ok = assign[k]===w.cls;
    item.appendChild(revLine(w.word+':', (assign[k] ? CLASS_NAMES[assign[k]] : '—')+(ok?' ✅':' ❌  (correto: '+CLASS_NAMES[w.cls]+')'), ok?'good':'bad'));
  });
  if(wrong) item.classList.add('wrong');
  return {item, wrong};
}

/* ================= JOGO DE NAVE ================= */
const SH_WAVES_PER_CMD = 3;
const SH_BULLET_SPEED = 620;
let sh = null, shCtx = null, shRaf = null, shToken = 0;

function startShooter(step){
  if(sh) sh.running = false;
  if(shRaf) cancelAnimationFrame(shRaf);
  const token = ++shToken;
  const cmds = SHOOTER_POOLS[step.topic];
  const waves = [];
  cmds.forEach((cmd,ci)=>{
    const okQ = [], badQ = [];
    const take = (queue, pool, used)=>{
      for(let tries=0; tries<6; tries++){
        if(!queue.length) queue.push(...shuffle(pool));
        const w = queue.pop();
        if(!used.includes(w)) return w;
      }
      return queue.pop() || pool[0];
    };
    for(let w=0; w<SH_WAVES_PER_CMD; w++){
      const nOk = Math.random()<0.5 ? 1 : 2;
      const used = [];
      const words = [];
      for(let k=0;k<nOk;k++){ const t = take(okQ, cmd.ok, used); used.push(t); words.push({text:t, ok:true}); }
      for(let k=0;k<4-nOk;k++){ const t = take(badQ, cmd.bad, used); used.push(t); words.push({text:t, ok:false}); }
      waves.push({cmd:ci, words:shuffle(words)});
    }
  });
  sh = {
    step, cmds, waves, waveIdx:0, words:[], bullets:[], fx:[],
    lives:3, hits:0, errors:0, missed:0, rocketX:0, running:true,
    lastTs:0, lastShot:0, keys:{left:false,right:false}, curCmd:-1, gap:0, W:0, H:0, stars:[], time:0, token
  };
  document.getElementById('sh-over').classList.remove('show');
  document.getElementById('shooter').classList.add('open');
  requestAnimationFrame(()=>{
    if(token !== shToken) return;
    shSetupCanvas();
    sh.rocketX = sh.W/2;
    shUpdateHud();
    shSpawnWave();
    shRaf = requestAnimationFrame(shLoop);
  });
}

function shSetupCanvas(){
  const canvas = document.getElementById('sh-canvas');
  const wrap = document.getElementById('sh-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  shCtx = canvas.getContext('2d');
  shCtx.setTransform(dpr,0,0,dpr,0,0);
  sh.W = W; sh.H = H;
  sh.rocketX = clamp(sh.rocketX || W/2, 22, W-22);
  if(!sh.stars.length){
    for(let i=0;i<45;i++) sh.stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.4+.4, p:Math.random()*6});
  }
}

function shUpdateHud(){
  document.getElementById('sh-lives').textContent = '❤️'.repeat(Math.max(0,sh.lives)) + '🖤'.repeat(Math.max(0,3-sh.lives));
  document.getElementById('sh-score').textContent = 'Acertos: '+sh.hits+' · Onda '+Math.max(1,sh.waveIdx)+'/'+sh.waves.length;
}

function shSetCommand(ci){
  sh.curCmd = ci;
  document.getElementById('sh-cmd-text').textContent = sh.cmds[ci].label;
  const box = document.getElementById('sh-cmd');
  box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
}

function shSpawnWave(){
  const wave = sh.waves[sh.waveIdx];
  if(wave.cmd !== sh.curCmd) shSetCommand(wave.cmd);
  const ctx = shCtx;
  const lanes = wave.words.length;
  const laneW = sh.W/lanes;
  const order = shuffle(wave.words.map((_,i)=>i));
  const speed = 46 + sh.waveIdx*5;
  wave.words.forEach((w,i)=>{
    let fs = 15;
    ctx.font = '800 '+fs+'px system-ui, sans-serif';
    let tw = ctx.measureText(w.text).width;
    if(tw+22 > laneW-6){ fs = clamp(fs*(laneW-28)/tw, 9, 15); ctx.font = '800 '+fs+'px system-ui, sans-serif'; tw = ctx.measureText(w.text).width; }
    const bw = Math.min(laneW-6, tw+22);
    sh.words.push({
      text:w.text, ok:w.ok, fs, w:bw, h:32,
      x: laneW*i + laneW/2,
      y: -24 - order[i]*72,
      vy: speed, alive:true
    });
  });
  sh.waveIdx++;
  shUpdateHud();
}

function shFire(){
  if(!sh || !sh.running) return;
  const now = performance.now();
  if(now - sh.lastShot < 150) return;
  sh.lastShot = now;
  sh.bullets.push({x:sh.rocketX, y:sh.H-54});
}

function shUpdate(dt){
  sh.time += dt;
  const dir = (sh.keys.right?1:0) - (sh.keys.left?1:0);
  if(dir) sh.rocketX = clamp(sh.rocketX + dir*320*dt, 22, sh.W-22);

  sh.bullets.forEach(b=>{ b.y -= SH_BULLET_SPEED*dt; });
  sh.bullets = sh.bullets.filter(b=>b.y > -30);

  sh.words.forEach(w=>{
    if(!w.alive) return;
    w.y += w.vy*dt;
    if(w.y - w.h/2 > sh.H){ w.alive = false; if(w.ok) sh.missed++; }
  });

  for(let bi=sh.bullets.length-1; bi>=0; bi--){
    const b = sh.bullets[bi];
    for(const w of sh.words){
      if(!w.alive || w.y < -w.h/2) continue;
      if(Math.abs(b.x-w.x) <= w.w/2+3 && Math.abs(b.y-w.y) <= w.h/2+8){
        sh.bullets.splice(bi,1);
        w.alive = false;
        if(w.ok){ sh.hits++; sh.fx.push({x:w.x, y:w.y, text:'+1', color:'#6CFF8E', t:0}); }
        else { sh.errors++; sh.lives--; sh.fx.push({x:w.x, y:w.y, text:'✗ '+w.text, color:'#FF8A7A', t:0}); }
        shUpdateHud();
        if(sh.lives<=0){ shEnd(false); return; }
        break;
      }
    }
  }

  sh.fx.forEach(f=>{ f.t += dt; f.y -= 34*dt; });
  sh.fx = sh.fx.filter(f=>f.t < 0.9);
  sh.words = sh.words.filter(w=>w.alive);
  // sem palavras certas restantes, as erradas saem rápido para a próxima onda não demorar
  if(sh.words.length && sh.words.every(w=>!w.ok)) sh.words.forEach(w=>{ w.vy = Math.max(w.vy, 340); });

  if(sh.gap>0){
    sh.gap -= dt;
    if(sh.gap<=0) shSpawnWave();
    return;
  }
  if(sh.words.length) return;
  if(sh.waveIdx >= sh.waves.length){ shEnd(true); return; }
  const next = sh.waves[sh.waveIdx];
  sh.gapNewCmd = next.cmd !== sh.curCmd;
  sh.gap = sh.gapNewCmd ? 1.4 : 0.35;
}

function shRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function shDraw(){
  const ctx = shCtx, W = sh.W, H = sh.H;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0B1026'); g.addColorStop(1,'#1E2A5A');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  sh.stars.forEach(s=>{
    ctx.globalAlpha = .35 + .35*Math.sin(sh.time*2 + s.p);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  sh.words.forEach(w=>{
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.strokeStyle = 'rgba(242,183,5,.9)';
    ctx.lineWidth = 2;
    shRoundRect(ctx, w.x-w.w/2, w.y-w.h/2, w.w, w.h, w.h/2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#161829';
    ctx.font = '800 '+w.fs+'px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(w.text, w.x, w.y+1);
  });

  ctx.font = '22px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  sh.bullets.forEach(b=>ctx.fillText('⚡', b.x, b.y));

  ctx.save();
  ctx.translate(sh.rocketX, H-30);
  ctx.rotate(-Math.PI/4);
  ctx.font = '40px sans-serif';
  ctx.fillText('🚀', 0, 0);
  ctx.restore();

  sh.fx.forEach(f=>{
    ctx.globalAlpha = Math.max(0, 1 - f.t/0.9);
    ctx.fillStyle = f.color;
    ctx.font = '900 18px system-ui, sans-serif';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  if(sh.gap>0 && sh.gapNewCmd){
    ctx.fillStyle = 'rgba(8,10,24,.6)';
    ctx.fillRect(0, H/2-34, W, 68);
    ctx.fillStyle = '#F2B705';
    ctx.font = '900 20px system-ui, sans-serif';
    ctx.fillText('Novo comando!', W/2, H/2-10);
    ctx.fillStyle = '#fff';
    ctx.font = '800 16px system-ui, sans-serif';
    ctx.fillText(sh.cmds[sh.waves[sh.waveIdx].cmd].label, W/2, H/2+14);
  }
}

function shLoop(ts){
  if(!sh || !sh.running || sh.token !== shToken) return;
  const dt = sh.lastTs ? Math.min(0.05, (ts - sh.lastTs)/1000) : 0;
  sh.lastTs = ts;
  shUpdate(dt);
  if(!sh.running) return;
  shDraw();
  shRaf = requestAnimationFrame(shLoop);
}

function shEnd(won){
  sh.running = false;
  if(shRaf) cancelAnimationFrame(shRaf);
  shDraw();
  state.game.hits += sh.hits;
  state.game.errors += sh.errors;
  saveState();
  document.getElementById('sh-over-title').textContent = won ? '🚀 Missão cumprida!' : '💥 Suas vidas acabaram!';
  document.getElementById('sh-over-text').textContent =
    'Você acertou '+sh.hits+(sh.hits===1?' palavra certa':' palavras certas')+' e atingiu '+sh.errors+(sh.errors===1?' errada.':' erradas.');
  document.getElementById('sh-over').classList.add('show');
}

function shClose(){
  if(sh){ sh.running = false; if(shRaf) cancelAnimationFrame(shRaf); }
  document.getElementById('shooter').classList.remove('open');
}

(function setupShooterControls(){
  const wrap = document.getElementById('sh-wrap');
  const localX = e=>e.clientX - wrap.getBoundingClientRect().left;
  wrap.addEventListener('pointerdown', e=>{
    if(!sh || !sh.running) return;
    wrap.setPointerCapture(e.pointerId);
    sh.rocketX = clamp(localX(e), 22, sh.W-22);
    shFire();
  });
  wrap.addEventListener('pointermove', e=>{
    if(!sh || !sh.running || !wrap.hasPointerCapture(e.pointerId)) return;
    sh.rocketX = clamp(localX(e), 22, sh.W-22);
  });
  document.addEventListener('keydown', e=>{
    if(!sh || !sh.running) return;
    if(e.key==='ArrowLeft') sh.keys.left = true;
    else if(e.key==='ArrowRight') sh.keys.right = true;
    else if(e.key===' ' || e.key==='ArrowUp'){ e.preventDefault(); shFire(); }
  });
  document.addEventListener('keyup', e=>{
    if(!sh) return;
    if(e.key==='ArrowLeft') sh.keys.left = false;
    if(e.key==='ArrowRight') sh.keys.right = false;
  });
  document.getElementById('sh-back').addEventListener('click', ()=>{ shClose(); advance(); });
  document.getElementById('sh-again').addEventListener('click', ()=>startShooter(sh.step));
  document.getElementById('sh-skip').addEventListener('click', ()=>{ shClose(); advance(); });
  window.addEventListener('resize', ()=>{
    if(sh && document.getElementById('shooter').classList.contains('open')) shSetupCanvas();
  });
})();

/* ================= INIT ================= */
renderStart();
</script>
</body>
